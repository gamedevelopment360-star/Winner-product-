<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Research</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#eee}
  header{padding:16px;font-size:20px;font-weight:700}
  .bar{display:flex;gap:8px;padding:0 16px 12px}
  input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#eee;font-size:16px}
  button{padding:12px 16px;border:0;border-radius:10px;background:#2ecc71;color:#000;font-weight:700;font-size:16px}
  #status{padding:0 16px 8px;color:#9aa}
  .grid{display:grid;gap:12px;padding:0 16px 24px}
  .card{display:flex;gap:12px;background:#1a1d24;border-radius:12px;padding:10px}
  .card img{width:96px;height:96px;object-fit:cover;border-radius:8px;background:#222}
  .name{font-size:14px;line-height:1.3;margin-bottom:6px}
  .meta{font-size:13px;color:#aab}
  .score{display:inline-block;padding:2px 8px;border-radius:20px;font-weight:700;font-size:13px;color:#000}
  .hi{background:#2ecc71}.mid{background:#f1c40f}.lo{background:#e67e22}
  .pf{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pf input{width:64px;padding:6px;font-size:14px}
  .pf button{padding:6px 10px;font-size:13px}
  .res{font-size:13px;margin-top:6px;line-height:1.5;width:100%}
  .good{color:#2ecc71}.bad{color:#e74c3c}
</style>
</head>
<body>
<header>Winning Products</header>
<div class="bar"><button id="win" style="flex:1">Find winners automatically</button></div>
<div class="bar">
  <input id="q" placeholder="or search a keyword" enterkeyhint="search">
  <button id="go">Search</button>
</div>
<div id="status"></div>
<div class="grid" id="out"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(j, label) {
  if (!j.results || !j.results.length) {
    $('status').textContent = 'No products found. Try again or another keyword.';
    return;
  }
  $('status').textContent = j.results.length + ' ' + label + ', best first';
  $('out').innerHTML = j.results.map((p) => {
    const cls = p.score >= 70 ? 'hi' : p.score >= 45 ? 'mid' : 'lo';
    const img = /^https?:\/\//.test(p.image || '') ? esc(p.image) : '';
    return `<div class="card">
      <img src="${img}" alt="" loading="lazy">
      <div>
        <div class="name">${esc(p.name)}</div>
        <div class="meta">Cost $${esc(p.cost)} &middot; Sell ~$${esc(p.suggestedPrice)}</div>
        <div class="meta">${esc(p.category || '')}</div>
        <div class="meta">Listed by ${esc(p.listedBySellers)} sellers</div>
        <span class="score ${cls}">Score ${esc(p.score)}</span>
        <div class="pf" data-pid="${esc(p.pid)}">
          Sell $<input type="number" step="0.01" class="sell" value="${esc(p.suggestedPrice)}">
          Ads $<input type="number" step="0.01" class="ad" value="8">
          <button class="calc">Real profit</button>
          <div class="res"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function load(url, label, msg) {
  $('status').textContent = msg;
  $('out').innerHTML = '';
  try {
    const r = await fetch(url);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Request failed');
    render(j, label);
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  }
}

function search() {
  const q = $('q').value.trim();
  if (q) load('/api/research?q=' + encodeURIComponent(q), 'products', 'Searching CJ...');
}
function winners() {
  load('/api/research/winners', 'winners', 'Scanning niches... this takes about 15 seconds the first time');
}
$('win').addEventListener('click', winners);
document.addEventListener('click', async (e) => {
  if (!e.target.classList.contains('calc')) return;
  const box = e.target.closest('.pf');
  const res = box.querySelector('.res');
  e.target.disabled = true;
  res.textContent = 'Asking CJ for shipping and stock...';
  try {
    const u = '/api/research/profit?pid=' + encodeURIComponent(box.dataset.pid) +
      '&sell=' + encodeURIComponent(box.querySelector('.sell').value) +
      '&ad=' + encodeURIComponent(box.querySelector('.ad').value);
    const r = await fetch(u);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Failed');
    const m = (x) => x == null ? 'unknown' : '$' + Number(x).toFixed(2);
    const cls = j.profit == null ? '' : j.profit > 0 ? 'good' : 'bad';
    res.innerHTML =
      'Sell ' + m(j.sell) + ' - cost ' + m(j.cost) + ' - shipping ' + m(j.shipping) +
      (j.shippingMethod ? ' (' + esc(j.shippingMethod) + (j.deliveryDays ? ', ' + esc(j.deliveryDays) + ' days' : '') + ')' : '') +
      ' - fee ' + m(j.paymentFee) + ' - ads ' + m(j.adCost) +
      '<br><b class="' + cls + '">Profit ' + m(j.profit) + (j.margin != null ? ' (' + j.margin + '%)' : '') + '</b>' +
      ' &middot; Stock: ' + (j.inStock == null ? 'unknown' : j.inStock ? 'in stock' : 'OUT') +
      '<br><i>Estimate: fee and ads are guesses, refunds not included.</i>';
  } catch (err) {
    res.textContent = 'Error: ' + err.message;
  } finally {
    e.target.disabled = false;
  }
});
$('go').addEventListener('click', search);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
</script>
</body>
</html>
