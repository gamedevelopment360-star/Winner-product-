<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winning Product Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#eee}
header{padding:16px;font-size:22px;font-weight:800}
.sub{padding:0 16px 12px;color:#9aa;font-size:13px}
.bar{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
input{min-width:0;flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#eee;font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:#2ecc71;color:#000;font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
.season-btn{background:#1a1d24;border:1px solid #333;color:#eee;font-weight:400}
#status{padding:0 16px 12px;color:#9aa;font-size:13px}
#out{display:grid;gap:12px;padding:0 16px 24px}
.card{display:flex;gap:12px;background:#1a1d24;border:1px solid #292d36;border-radius:12px;padding:10px;min-width:0}
.card img{width:96px;height:96px;flex-shrink:0;object-fit:cover;border-radius:8px;background:#222}
.details{min-width:0;flex:1}
.name{font-size:14px;line-height:1.4;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}
.meta{font-size:12px;color:#aab;margin:4px 0;overflow-wrap:anywhere}
.score,.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-weight:700;font-size:11px;margin:3px 4px 3px 0}
.hi{background:#2ecc71;color:#000}
.mid{background:#f1c40f;color:#000}
.lo{background:#e67e22;color:#000}
.neutral{background:#444;color:#eee}
.season-peak{background:#2ecc71;color:#000}
.season-soon{background:#f1c40f;color:#000}
.season-off{background:#555;color:#eee}
.comp-Low{background:#2ecc71;color:#000}
.comp-Medium{background:#f1c40f;color:#000}
.comp-High{background:#e74c3c;color:#fff}
.source-cj{background:#9b59b6;color:#fff}
.source-ali{background:#e67e22;color:#000}
.rise{background:#3498db;color:#000}
.trendfan{background:#1abc9c;color:#000}
.links{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.links a{padding:5px 9px;border-radius:8px;border:1px solid #444;color:#8cf;font-size:12px;text-decoration:none}
.pf{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.pf input{flex:0 0 88px;width:88px;min-width:88px;padding:7px;font-size:13px}
.why{margin-top:8px;font-size:12px;color:#c9ced8}.why summary{cursor:pointer;color:#8cf}.why ul{margin:6px 0 0;padding-left:18px}.why li{margin:2px 0}.why .flags{margin-top:6px;color:#f0a35e}.why .flags div{margin:2px 0}
.pf button{padding:8px;font-size:12px}
.res{font-size:12px;margin-top:6px;line-height:1.6;width:100%;overflow-wrap:anywhere}
.good{color:#2ecc71}.bad{color:#e74c3c}
.chip{margin:0 5px 5px 0;padding:6px 10px;background:#1a1d24;border:1px solid #333;color:#eee;font-weight:400}
.notice{margin:0 16px 12px;padding:10px;border:1px solid #444;border-radius:10px;color:#b8c4d5;font-size:12px;line-height:1.5}
@media(max-width:380px){.card img{width:76px;height:76px}.card{gap:8px;padding:8px}.bar button{padding:10px;font-size:12px}}
</style>
</head>
<body>

<header>🏆 Winning Product Finder</header>
<div class="sub">Find products with sales potential, rising demand and room for profit.</div>

<div class="notice">
Sales verification matters: seller counts, views and likes are not the same as units sold.
Sales and growth scores are shown only when supported by data.
</div>

<div class="bar">
<button id="win" style="flex:1">Find Winning Products</button>
</div>
<div class="bar">
<button id="trend" style="flex:1;background:#f1c40f">AliExpress Picks</button>
<button id="rise" style="flex:1;background:#3498db">Rising (new sellers)</button>
</div>
<div class="bar">
<button class="season-btn" data-season="summer">Summer</button>
<button class="season-btn" data-season="winter">Winter</button>
<button class="season-btn" data-season="christmas">Christmas</button>
<button class="season-btn" data-season="halloween">Halloween</button>
<button class="season-btn" data-season="valentine">Valentine's</button>
<button class="season-btn" data-season="backtoschool">Back to School</button>
</div>
<div class="bar">
<input id="q" placeholder="Search a product keyword" enterkeyhint="search">
<button id="go">Search</button>
</div>

<div id="recent" style="padding:0 16px 8px"></div>
<div id="status" aria-live="polite">Choose a research option to begin.</div>
<div id="out"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

let requestNumber = 0;

function numberOrNull(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function money(v) {
  const n = numberOrNull(v);
  return n === null ? "Unknown" : "$" + n.toFixed(2);
}

function seasonBadge(label) {
  if (!label) return "";
  const cls = /peak/i.test(label) ? "season-peak" :
    /(coming|approaching|soon)/i.test(label) ? "season-soon" : "season-off";
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

function compBadge(c) {
  if (!["Low","Medium","High"].includes(c)) return "";
  return `<span class="badge comp-${c}">${c} competition</span>`;
}

function sourceBadge(source) {
  if (source === "aliexpress") return `<span class="badge source-ali">AliExpress - order manually</span>`;
  return `<span class="badge source-cj">CJ - auto-fulfilled</span>`;
}

function trendBadge(p) {
  return p.trending ? `<span class="badge trendfan">Trending</span>` : "";
}

function riseBadge(p) {
  const g = numberOrNull(p.growth);
  const d = numberOrNull(p.growthDays);
  if (g === null || g <= 0) return "";
  return `<span class="badge rise">+${g} sellers in ${d === null ? "a few" : d} day${d > 1 ? "s" : ""}</span>`;
}

function salesInfo(p) {
  const units = numberOrNull(p.sales30 ?? p.sales_last_30_days);
  const growth = numberOrNull(p.salesGrowth ?? p.sales_growth_percent);

  let text = "30-day sales: unavailable";
  if (units !== null) text = `30-day sales: ${units.toLocaleString()}`;

  let growthText = "";
  if (growth !== null) {
    growthText = growth > 0
      ? `<span class="badge rise">Sales +${growth}%</span>`
      : growth < 0
        ? `<span class="badge lo">Sales ${growth}%</span>`
        : `<span class="badge neutral">Sales stable</span>`;
  }

  return `<div class="meta">${text}</div>${growthText}`;
}

function linksFor(name) {
  const q = encodeURIComponent(String(name || "").split(/\s+/).slice(0,5).join(" "));
  return `<div class="links">
    <a target="_blank" rel="noopener noreferrer" href="https://www.tiktok.com/search?q=${q}">TikTok</a>
    <a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${q}">YouTube</a>
    <a target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=${q}&amp;search_type=keyword_unordered">Ad Library</a>
  </div>`;
}

function render(j, label) {
  if (!j || !Array.isArray(j.results) || !j.results.length) {
    $("status").textContent = j?.message || "No products found. Try another keyword or research option.";
    $("out").innerHTML = "";
    return;
  }

  // Keep the order the server sent (trending first, or most new sellers first).
  const products = j.results;

  $("status").textContent = `${products.length} ${label}` + (j.source ? ` (${j.source})` : "") + "." + (j.message ? " " + j.message : "");
  $("out").innerHTML = products.map((p, index) => {
    const score = numberOrNull(p.score);
    const cls = score === null ? "neutral" :
      score >= 70 ? "hi" : score >= 45 ? "mid" : "lo";
    const rawImage = String(p.image || "").trim();
    const image = esc(rawImage.startsWith("//") ? "https:" + rawImage : /^https?:\/\//i.test(rawImage) ? rawImage : "");
    const price = numberOrNull(p.suggestedPrice);
    const pid = String(p.pid ?? "");
    const confidence = p.confidence ?? p.dataConfidence;
    const sellers = numberOrNull(p.listedBySellers);

    return `<article class="card">
      <img src="${image}" alt="${esc(p.name || "Product")}" loading="lazy" referrerpolicy="no-referrer">
      <div class="details">
        <div class="name">${index + 1}. ${esc(p.name || "Unnamed product")}</div>
        <div class="meta">Supplier cost: ${money(p.cost)} · Suggested price: ${money(price)}</div>
        <div class="meta">${esc(p.category || "Uncategorized")}</div>
        <div class="meta">Competing sellers: ${sellers === null ? "Unknown" : sellers}</div>
        ${salesInfo(p)}
        <div>
          <span class="badge ${cls}">Score ${score === null ? "N/A" : score + "/100"}</span>
          ${sourceBadge(p.source)}
          ${seasonBadge(p.seasonLabel)}
          ${compBadge(p.competition)}
          ${trendBadge(p)}
          ${riseBadge(p)}
        </div>
        ${confidence == null ? "" : `<div class="meta">Data confidence: ${esc(confidence)}</div>`}
        ${whyBlock(p)}
        ${linksFor(p.name)}
        <div class="pf" data-pid="${esc(pid)}" data-cost="${esc(p.cost)}">
          Sell $<input type="number" min="0.01" step="0.01" class="sell" value="${price === null ? "" : esc(price)}" aria-label="Selling price">
          Ads $<input type="number" min="0" step="0.01" class="ad" value="8" aria-label="Advertising cost per purchase">
          <button class="calc">Calculate profit</button>
          <div class="res"></div>
        </div>
      </div>
    </article>`;
  }).join("");
}

function whyBlock(p) {
  const parts = Array.isArray(p.scoreParts) ? p.scoreParts : [];
  const flags = Array.isArray(p.dataFlags) ? p.dataFlags : [];
  if (!parts.length && !flags.length) return "";
  const rows = parts.map((x) => {
    const pts = Number(x.pts);
    const sign = pts > 0 && !x.max ? "+" : "";
    const of = x.max ? ` of ${x.max}` : "";
    return `<li><b>${esc(x.label)}:</b> ${sign}${esc(pts)}${of}. ${esc(x.note || "")}</li>`;
  }).join("");
  const warn = flags.map((f) => `<div>⚠ ${esc(f)}</div>`).join("");
  return `<details class="why"><summary>Why this score</summary>` +
    (rows ? `<ul>${rows}</ul>` : "") +
    (warn ? `<div class="flags">${warn}</div>` : "") +
    `</details>`;
}

async function load(url, label, message) {
  const id = ++requestNumber;
  $("status").textContent = message;
  $("out").innerHTML = "";

  try {
    const r = await fetch(url, {headers:{"Accept":"application/json"}});
    const j = await r.json();
    if (id !== requestNumber) return;
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    render(j, label);
  } catch (e) {
    if (id !== requestNumber) return;
    $("status").textContent = "Error: " + e.message +
      ". Check that your backend server is running and the API route exists.";
  }
}

function search() {
  const q = $("q").value.trim();
  if (!q) {
    $("status").textContent = "Enter a product keyword first.";
    return;
  }
  load("/api/research?q=" + encodeURIComponent(q), "search results", "Searching products...")
    .then(loadRecent);
}

function winners() {
  load("/api/research/winners", "potential winners",
    "Analyzing competition, profit and seasonality...");
}

async function loadRecent() {
  try {
    const r = await fetch("/api/searches?limit=15");
    if (!r.ok) return;
    const j = await r.json();
    const list = Array.isArray(j.results) ? j.results : [];
    $("recent").innerHTML = list.length
      ? '<div class="meta">Recent searches:</div>' +
        list.map(s => `<button class="chip" data-q="${esc(s.query)}">${esc(s.query)}</button>`).join("")
      : "";
  } catch (_) {}
}

document.addEventListener("click", async e => {
  const chip = e.target.closest(".chip");
  if (chip) {
    $("q").value = chip.dataset.q || "";
    search();
    return;
  }

  const btn = e.target.closest(".calc");
  if (!btn) return;

  const box = btn.closest(".pf");
  const res = box.querySelector(".res");
  const sell = numberOrNull(box.querySelector(".sell").value);
  const ad = numberOrNull(box.querySelector(".ad").value);

  if (!box.dataset.pid) {
    res.textContent = "Product ID is missing; cannot retrieve supplier costs.";
    return;
  }
  if (sell === null || sell <= 0 || ad === null || ad < 0) {
    res.textContent = "Enter a valid selling price and advertising cost.";
    return;
  }

  btn.disabled = true;
  res.textContent = "Calculating using supplier and shipping data...";

  try {
    const url = "/api/research/profit?pid=" + encodeURIComponent(box.dataset.pid) +
      "&sell=" + encodeURIComponent(sell) +
      "&ad=" + encodeURIComponent(ad) +
      "&cost=" + encodeURIComponent(box.dataset.cost || "");
    const r = await fetch(url, {headers:{"Accept":"application/json"}});
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || "Profit calculation failed");

    const profit = numberOrNull(j.profit);
    const margin = numberOrNull(j.margin);
    const cls = profit === null ? "" : profit >= 0 ? "good" : "bad";

    res.innerHTML =
      `Selling price: ${money(j.sell)}<br>` +
      `Product cost: ${money(j.cost)}<br>` +
      `Shipping: ${money(j.shipping)}<br>` +
      `Payment fee: ${money(j.paymentFee)}<br>` +
      `Advertising: ${money(j.adCost)}<br>` +
      `<b class="${cls}">Estimated profit: ${money(profit)}${margin === null ? "" : " (" + esc(margin) + "%)"}</b><br>` +
      `Stock: ${j.inStock == null ? "Unknown" : j.inStock ? "In stock" : "Out of stock"}<br>` +
      `<i>Confirm taxes, refunds, fulfilment and other costs before making a decision.</i>`;
  } catch (err) {
    res.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
});

$("win").addEventListener("click", winners);

$("trend").addEventListener("click", () =>
  load("/api/research/trending", "AliExpress picks", "Loading trending products..."));

$("rise").addEventListener("click", () =>
  load("/api/research/rising", "products gaining sellers (most first)",
    "Checking which products gained sellers..."));

document.querySelectorAll(".season-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const season = btn.dataset.season;
    load("/api/research/winners/" + encodeURIComponent(season),
      season + " products", "Scanning " + btn.textContent + "... this can take about 30 seconds the first time");
  });
});

$("go").addEventListener("click", search);
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

loadRecent();
</script>
</body>
</html>
